[project]
name = "wsm-reveng"
version = "0.1.0"
description = "Python reimplementation of Samsung's WSM authentication."
requires-python = ">=3.12"
dependencies = ["cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsm"]
